{% extends "base.html" %}
{% load static %}

<h2> Recipe List </h2>

{% if user.is_authenticated %}
<a href="{% url 'ledger:recipe-create' %}">Create a new recipe</a>
{% endif %}

{% block content %}
    {% for recipe in recipes %}
    <ul><li><a href="{{ recipe.get_absolute_url}}">{{ recipe.name }}</a></li></ul>
    {% endfor %}
{% endblock %}
